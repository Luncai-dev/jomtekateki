
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>Teka-Teki 30 Soalan</title>

<style>
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#101b35,#203d70);
  color:white;
  display:grid;
  place-items:center;
  padding:20px;
}
.card {
  background:#1c2d50;
  border-radius:20px;
  padding:25px;
  width:min(480px,100%);
  text-align:center;
}
.timer {
  font-size:40px;
  font-weight:bold;
  color:#38bdf8;
  margin:15px 0;
}
.option, #startButton {
  display:block;
  width:100%;
  padding:14px;
  margin:10px 0;
  background:#334d78;
  color:white;
  border:1px solid #56729d;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}
.option { text-align:left; }
.option:hover, #startButton:hover {
  background:#42679e;
}
button:disabled {
  opacity:.6;
  cursor:default;
}
#message { color:#fcd34d; }
</style>
</head>

<body>
<div class="card">
  <h2>TEKA-TEKI 30 SOALAN</h2>

  <button id="startButton" type="button">
    MULA BERMAIN
  </button>

  <p id="progress">Bersedia untuk bermain?</p>
  <div class="timer" id="timer">10</div>

  <h3 id="question">Tekan MULA BERMAIN</h3>
  <div id="options"></div>

  <p id="message"></p>

<button
  id="claimButton"
  type="button"
  style="display:none;"
>
  TUNTUT HADIAH MELALUI WHATSAPP
</button>

 
</div>

<script>
const PROJECT_URL =
  "https://uorvbnckisrewqbfetes.supabase.co";

const API =
  PROJECT_URL + "/functions/v1/teka-teki-api";

const startButton = document.getElementById("startButton");
const progress = document.getElementById("progress");
const timer = document.getElementById("timer");
const question = document.getElementById("question");
const options = document.getElementById("options");
const message = document.getElementById("message");

 
const claimButton =
  document.getElementById("claimButton");

let finalResult = null;


let gameToken = sessionStorage.getItem("game_token");
let timerInterval = null;
let submitting = false;
let currentQuestion = 0;
let clockOffset = 0;

function shuffle(array) {
  const items = [...array];

  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }

  return items;
}

async function apiRequest(action, method, token, body) {
  const response = await fetch(API + "?action=" + action, {
    method,
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json"
    },
    ...(body !== undefined
      ? { body: JSON.stringify(body) }
      : {})
  });

  const data = await response.json();

  if (!response.ok || !data.success) {
    throw new Error(
      data.error || "Ralat HTTP " + response.status
    );
  }

  return data;
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

async function showCurrentQuestion() {
  stopTimer();
  options.replaceChildren();
  message.textContent = "Memuatkan soalan...";

  const data = await apiRequest(
    "current-question", "GET", gameToken
  );

  if (data.finished) {
    progress.textContent = "Permainan tamat";
    question.textContent = "Semua soalan telah dijawab.";
    timer.textContent = "✓";
    message.textContent =
      "Permainan selesai. Sila semak keputusan.";
    return;
  }

  currentQuestion = data.question_number;

  progress.textContent =
    "Soalan " + currentQuestion + " / 30";

  question.textContent = data.question.question_text;
  message.textContent = "";

  // Laraskan jam pelayar kepada masa server
  clockOffset =
    Date.parse(data.server_time) - Date.now();

  const deadline = Date.parse(data.deadline);

  // Kekalkan huruf jawapan asal walaupun butang diacak
  const choices = shuffle([
    { key:"A", text:data.question.option_a },
    { key:"B", text:data.question.option_b },
    { key:"C", text:data.question.option_c },
    { key:"D", text:data.question.option_d }
  ]);

  for (const choice of choices) {
    const button = document.createElement("button");
    button.className = "option";
    button.textContent = choice.text;
    button.onclick = () => submitAnswer(choice.key);
    options.appendChild(button);
  }

  function updateTimer() {
    const remaining = Math.max(
      0,
      Math.ceil(
        (deadline - (Date.now() + clockOffset)) / 1000
      )
    );

    timer.textContent = remaining;

    if (remaining <= 0) {
      stopTimer();
      submitAnswer(null);
    }
  }

  updateTimer();

  if (!submitting) {
    timerInterval = setInterval(updateTimer, 200);
  }
}

async function submitAnswer(answer) {
  if (submitting || !gameToken) return;

  submitting = true;
  stopTimer();

  options.querySelectorAll("button")
    .forEach(button => button.disabled = true);

  message.textContent =
    answer === null
      ? "Masa tamat! Menyimpan jawapan..."
      : "Menyimpan jawapan...";

  try {
    const result = await apiRequest(
      "submit-answer",
      "POST",
      gameToken,
      { answer }
    );

    if (result.finished) {
      finishGame(result);
      return;
    }

    submitting = false;
    await showCurrentQuestion();

  } catch (error) {
    message.textContent =
      "Ralat menyimpan jawapan: " + error.message;
    submitting = false;
  }
}


function finishGame(result) {
  stopTimer();

  // Simpan keputusan untuk proses tuntutan
  finalResult = result;

  // Jangan padam game_token lagi
  // Token diperlukan untuk claim-prize

  progress.textContent = "PERMAINAN TAMAT!";
  timer.textContent = "✓";

  question.textContent =
    "Markah: " + result.correct_answers + " / 30";

  options.replaceChildren();

  const amount = Number(result.prize_amount);

  if (amount > 0) {
    message.textContent =
      "Tahniah! Hadiah anda: RM" +
      amount.toFixed(2) +
      ". Tertakluk kepada pengesahan admin.";

    claimButton.style.display = "block";
  } else {
    message.textContent =
      "Terima kasih kerana bermain! " +
      "Anda belum layak menerima hadiah.";

    claimButton.style.display = "none";
  }
}

  stopTimer();

  sessionStorage.removeItem("game_token");
  gameToken = null;

  progress.textContent = "PERMAINAN TAMAT!";
  timer.textContent = "✓";

  question.textContent =
    "Markah: " + result.correct_answers + " / 30";

  options.replaceChildren();

  message.textContent =
    "Hadiah dikira: RM" +
    Number(result.prize_amount).toFixed(2) +
    " (belum disahkan untuk pembayaran)";
}

 
claimButton.addEventListener("click", async () => {
  if (!gameToken || !finalResult) {
    message.textContent =
      "Sesi tuntutan tidak tersedia.";
    return;
  }

  claimButton.disabled = true;
  claimButton.textContent = "Merekodkan tuntutan...";

  try {
    const result = await apiRequest(
      "claim-prize",
      "POST",
      gameToken,
      {}
    );

    const amount = Number(result.amount).toFixed(2);
    const claimId = result.claim_id;

    const whatsappMessage =
      "Salam Admin Teka-Teki 30 Soalan.\n\n" +
      "Saya ingin membuat tuntutan hadiah.\n" +
      "Markah: " + finalResult.correct_answers + "/30\n" +
      "Jumlah hadiah: RM" + amount + "\n" +
      "ID Tuntutan: " + claimId + "\n\n" +
      "Saya akan lampirkan screenshot keputusan " +
      "untuk semakan admin.";

    const whatsappURL =
      "https://wa.me/60194607688?text=" +
      encodeURIComponent(whatsappMessage);

    message.textContent =
      "Tuntutan telah direkodkan. " +
      "Sila hantar mesej dan screenshot melalui WhatsApp.";

    claimButton.textContent = "BUKA WHATSAPP";

    claimButton.onclick = () => {
      window.open(
        whatsappURL,
        "_blank",
        "noopener,noreferrer"
      );
    };

    // Buka WhatsApp selepas tuntutan direkodkan
    claimButton.onclick();

  } catch (error) {
    message.textContent =
      "Gagal merekodkan tuntutan: " + error.message;

    claimButton.disabled = false;
    claimButton.textContent =
      "TUNTUT HADIAH MELALUI WHATSAPP";
  }
});

 
startButton.addEventListener("click", async () => {
  const playerToken =
    sessionStorage.getItem("player_token");

  if (!playerToken) {
    alert("Sesi pemain tiada. Sila daftar dahulu.");
    location.href = "daftar.html";
    return;
  }

  startButton.disabled = true;
  message.textContent = "Memulakan permainan...";

  try {
    const result = await apiRequest(
      "start-game", "POST", playerToken, {}
    );

    gameToken = result.game_token;
    sessionStorage.setItem("game_token", gameToken);

    startButton.style.display = "none";
    await showCurrentQuestion();

  } catch (error) {
    message.textContent = error.message;
    startButton.disabled = false;
  }
});

// Sambung semula permainan apabila halaman dimuat semula
if (gameToken) {
  startButton.style.display = "none";

  showCurrentQuestion().catch(error => {
    message.textContent = error.message;
  });
}
</script>
</body>
</html>
