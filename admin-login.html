
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Login Admin - Teka-Teki</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101a32;
      color: white;
      padding: 20px;
    }
    main {
      max-width: 400px;
      margin: 70px auto;
      padding: 25px;
      background: #1e293b;
      border-radius: 15px;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 8px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    a { color: #93c5fd; }
  </style>
</head>
<body>
<main>
  <h2>Login Admin Teka-Teki</h2>

  <form id="loginForm">
    <input id="email" type="email"
           placeholder="E-mel Admin" required>
    <input id="password" type="password"
           placeholder="Kata Laluan" required>
    <button type="submit">Log Masuk</button>
  </form>

  <p id="message" role="status"></p>

  <p>
    <a href="index.html">
      ← Kembali ke Bahagian Daftar
    </a>
  </p>
</main>

<script>
document.getElementById("loginForm")
  .addEventListener("submit", async (event) => {
    event.preventDefault();

    const message =
      document.getElementById("message");

    message.textContent = "Sedang log masuk...";

    try {
      const response = await fetch(
        "/.netlify/functions/admin-login",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Login gagal");
      }

      sessionStorage.setItem(
        "admin_token",
        data.access_token
      );

      const check = await fetch(
        "/.netlify/functions/admin-records",
        {
          headers: {
            Authorization:
              "Bearer " + data.access_token
          }
        }
      );

      if (!check.ok) {
        throw new Error("Gagal mengesahkan akses admin");
      }

      const result = await check.json();

      message.textContent =
        "Login berjaya! Jumlah pemain: " +
        result.players.length;

    } catch (error) {
      message.textContent = error.message;
    }
  });
</script>
</body>
</html>
